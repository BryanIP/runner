name: release-assinatura-cli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex.: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build release binaries
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: bash ./scripts/build/build-all.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assinatura-release
          path: dist/bin/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: assinatura-release
          path: dist/bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: dist/bin/*
          generate_release_notes: true
